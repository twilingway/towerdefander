server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite fingerprints these, so a new release changes the name rather than the
  # content behind a name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The one file that must never be cached: a stale index.html after a release
  # asks for asset names that no longer exist, and the display comes up blank.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # The display's service worker and manifest are checked on every load. A
  # worker the browser kept in its own cache for a year is one no release can
  # replace - the stuck worker this whole shell is built to avoid.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
