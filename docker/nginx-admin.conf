server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The console calls /admin/balance and /admin/stats/batches on relative paths;
  # in development `apps/admin/vite.config.ts` proxies them. This is that proxy
  # in production. Keeping the console on one origin means its Authorization
  # header travels without preflight, and the API keeps CORS off every
  # administrative route.
  location /admin/ {
    proxy_pass http://space-api:2567;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # No X-Forwarded-For: the API authorizes by socket address and must not be
    # taught to trust a header a client can write.
    #
    # A statistics batch runs for minutes, and the console holds the request
    # open while it does.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    # The server answers a body over its own 1 MiB ceiling with a readable
    # error; nginx's default limit is exactly at that boundary and would answer
    # with 413 first.
    client_max_body_size 2m;
  }

  # The room dashboard is a separate page under /stats, and it is refused on the
  # public API host on purpose. Without this it would be reachable only from the
  # host's own loopback -- that is, nowhere an operator actually stands.
  location /stats/ {
    proxy_pass http://space-api:2567;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
