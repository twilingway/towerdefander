name: CI

# The quality gate, and nothing else. Releases are pulled by an agent on the
# host, so no job here has access to the deployment: this repository is public,
# and a self-hosted runner would let a fork's pull request execute its own
# workflow file on that machine.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        # The version comes from `packageManager` in package.json.
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          # The same major the API image runs, and the same one development
          # uses: the gate runs the built server, which imports the protocol
          # package as TypeScript source and needs Node's type stripping.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `check:ci` is `pnpm check` without `test:e2e`: format, lint, typecheck,
      # unit tests, build, and the headless network smoke that plays two waves
      # through the real wire.
      #
      # The Playwright suite is deliberately absent. It drives four browser
      # pages, a Phaser scene and a 20 Hz server at once, and a hosted runner
      # has no GPU, so Chrome renders the display in software. Measured on this
      # repository: with a GPU all nine specs pass, with software rendering on a
      # ten-core machine two fail, and on a hosted runner all nine fail on
      # timeouts -- the scripted crew starves and dies before it clears a wave.
      # That is a machine speed limit, not a defect the gate should report, and
      # raising the timeouts cannot fix a crew that plays badly in real time.
      #
      # So the browser suite stays in `pnpm check`, which is what runs before a
      # release on a machine that has a GPU. Reproduce the runner locally with
      # `E2E_SOFTWARE_GL=1 pnpm test:e2e`.
      - name: Check
        run: pnpm check:ci

      - name: Validate specifications
        run: pnpm spec:validate
